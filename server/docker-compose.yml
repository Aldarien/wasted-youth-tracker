services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - wyt-logs:/app/logs
    command: ["sh", "-lc", "chown -R www-data:www-data /app/logs && exec php-fpm"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: wasted_test
      DB_USER: root
      DB_PASS: root

  proxy:
    image: nginx:1.27-alpine
    profiles: [ui]
    ports:
      - "${UI_PORT:-8081}:80"
    volumes:
      - .:/app:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    labels:
      traefik.enable: "true"
      traefik.http.routers.wyt-local.rule: Host(`wyt.localhost`)
      traefik.http.services.wyt-local.loadbalancer.server.port: "80"
      traefik.docker.network: ${TRAEFIK_NETWORK:-global-proxy}
    networks:
      - default
      - traefik

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wasted_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-global-proxy}

volumes:
  wyt-logs:
